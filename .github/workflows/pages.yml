name: Deploy Oxiom static site to GitHub Pages
'on':
  push:
    branches:
    - dev
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: Oxiom-Systems/Oxiom-Systems.github.io/.github/workflows/ci-pages-build-recipe.yml@d18e342e92ec1f1c8675a145e6ceae4679929e9d
    permissions:
      contents: read
  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && github.ref_protected == true
    uses: Oxiom-Systems/Oxiom-Systems.github.io/.github/workflows/ci-pages-publish-recipe.yml@51fa37da0a535c173b6f5eca32bc7719addeda52
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
