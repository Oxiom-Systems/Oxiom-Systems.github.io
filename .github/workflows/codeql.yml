name: CodeQL
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '37 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    uses: Oxiom-Systems/Oxiom-Systems.github.io/.github/workflows/ci-codeql-recipe.yml@d18e342e92ec1f1c8675a145e6ceae4679929e9d
    with:
      # Root flips this literal only after canaries and managed-default retirement.
      upload_results: false
